name: Test successful pipeline download with 'nf-core pipelines download'

# Run the workflow when:
#  - dispatched manually
#  - when a PR is opened or reopened to main/master branch
#  - the head branch of the pull request is updated, i.e. if fixes for a release are pushed last minute to dev.
on:
  workflow_dispatch:
    inputs:
      testbranch:
        description: "The specific branch you wish to utilize for the test execution of nf-core pipelines download."
        required: true
        default: "dev"
  pull_request:
    branches:
      - main
      - master

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NF_CORE_VERSION: "3.5.2"
  NXF_ANSI_LOG: false

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      REPO_LOWERCASE: ${{ steps.get_repo_properties.outputs.REPO_LOWERCASE }}
      REPOTITLE_LOWERCASE: ${{ steps.get_repo_properties.outputs.REPOTITLE_LOWERCASE }}
      REPO_BRANCH: ${{ steps.get_repo_properties.outputs.REPO_BRANCH }}
    steps:
      - name: Get the repository name and current branch
        id: get_repo_properties
        env:
          TEST_BRANCH: ${{ github.event.inputs.testbranch || github.head_ref || 'dev' }}
        run: |
          {
            printf 'REPO_LOWERCASE=%s\n' "${GITHUB_REPOSITORY,,}"
            printf 'REPOTITLE_LOWERCASE=%s\n' "$(basename "${GITHUB_REPOSITORY,,}")"
            printf 'REPO_BRANCH=%s\n' "$TEST_BRANCH"
          } >> "$GITHUB_OUTPUT"

  download:
    runs-on: ubuntu-latest
    needs: configure
    steps:
      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2

      - name: Disk space cleanup
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: "3.14"
          architecture: "x64"

      - name: Setup Apptainer
        uses: eWaterCycle/setup-apptainer@4bb22c52d4f63406c49e94c804632975787312b3 # v2.0.0
        with:
          apptainer-version: 1.3.4

      - name: Limit Apptainer build resources
        run: |
          sudo "$(command -v apptainer)" config global --set "mksquashfs procs" 1
          sudo "$(command -v apptainer)" config global --set "mksquashfs mem" 1G

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "nf-core==$NF_CORE_VERSION"

      - name: Make a cache directory for the container images
        run: |
          mkdir -p ./singularity_container_images

      - name: Download the pipeline
        env:
          APPTAINER_DISABLE_CACHE: "true"
          APPTAINER_TMPDIR: ${{ runner.temp }}
          NXF_SINGULARITY_CACHEDIR: ./singularity_container_images
          REPO_BRANCH: ${{ needs.configure.outputs.REPO_BRANCH }}
          REPO_LOWERCASE: ${{ needs.configure.outputs.REPO_LOWERCASE }}
          REPOTITLE_LOWERCASE: ${{ needs.configure.outputs.REPOTITLE_LOWERCASE }}
        run: |
          nf-core pipelines download "$REPO_LOWERCASE" \
          --revision "$REPO_BRANCH" \
          --outdir "./$REPOTITLE_LOWERCASE" \
          --compress "none" \
          --container-system 'singularity' \
          --container-library "quay.io" -l "docker.io" -l "community.wave.seqera.io/library/" \
          --container-cache-utilisation 'amend' \
          --download-configuration 'yes'

      - name: Inspect download
        env:
          REPOTITLE_LOWERCASE: ${{ needs.configure.outputs.REPOTITLE_LOWERCASE }}
        run: tree "./$REPOTITLE_LOWERCASE"

      - name: Inspect container images
        run: tree ./singularity_container_images | tee ./container_initial

      - name: Count the downloaded number of container images
        id: count_initial
        run: |
          image_count=$(find ./singularity_container_images -mindepth 1 -maxdepth 1 | wc -l | xargs)
          echo "Initial container image count: $image_count"
          echo "IMAGE_COUNT_INITIAL=$image_count" >> "$GITHUB_OUTPUT"

      - name: Run the downloaded pipeline (stub)
        id: stub_run_pipeline
        continue-on-error: true
        env:
          NXF_SINGULARITY_CACHEDIR: ./singularity_container_images
          NXF_SINGULARITY_HOME_MOUNT: true
          REPO_BRANCH: ${{ needs.configure.outputs.REPO_BRANCH }}
          REPOTITLE_LOWERCASE: ${{ needs.configure.outputs.REPOTITLE_LOWERCASE }}
        run: |
          pipeline_dir=${REPO_BRANCH//[^[:alnum:]_]/_}
          nextflow run "./$REPOTITLE_LOWERCASE/$pipeline_dir" -stub -profile test,singularity --outdir ./results
      - name: Run the downloaded pipeline (stub run not supported)
        id: run_pipeline
        if: ${{ steps.stub_run_pipeline.outcome == 'failure' }}
        env:
          NXF_SINGULARITY_CACHEDIR: ./singularity_container_images
          NXF_SINGULARITY_HOME_MOUNT: true
          REPO_BRANCH: ${{ needs.configure.outputs.REPO_BRANCH }}
          REPOTITLE_LOWERCASE: ${{ needs.configure.outputs.REPOTITLE_LOWERCASE }}
        run: |
          pipeline_dir=${REPO_BRANCH//[^[:alnum:]_]/_}
          nextflow run "./$REPOTITLE_LOWERCASE/$pipeline_dir" -profile test,singularity --outdir ./results

      - name: Count the downloaded number of container images
        id: count_afterwards
        run: |
          image_count=$(find ./singularity_container_images -mindepth 1 -maxdepth 1 | wc -l | xargs)
          echo "Post-pipeline run container image count: $image_count"
          echo "IMAGE_COUNT_AFTER=$image_count" >> "$GITHUB_OUTPUT"

      - name: Compare container image counts
        id: count_comparison
        env:
          FINAL_COUNT: ${{ steps.count_afterwards.outputs.IMAGE_COUNT_AFTER }}
          INITIAL_COUNT: ${{ steps.count_initial.outputs.IMAGE_COUNT_INITIAL }}
        run: |
          if (( INITIAL_COUNT != FINAL_COUNT )); then
            difference=$((FINAL_COUNT - INITIAL_COUNT))
            printf '%s additional container images were downloaded at runtime. The pipeline has no support for offline runs!\n' "$difference"
            tree ./singularity_container_images > ./container_afterwards
            diff ./container_initial ./container_afterwards
            exit 1
          else
            echo "The pipeline can be downloaded successfully!"
          fi

      - name: Upload Nextflow logfile for debugging purposes
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: nextflow_logfile.txt
          path: .nextflow.log*
          include-hidden-files: true
