name: nf-core template version comment
# This workflow is triggered on PRs to check if the pipeline template version matches the latest nf-core version.
# It posts a comment to the PR, even if it comes from a fork.

on: pull_request_target

permissions:
  contents: read
  pull-requests: write

jobs:
  template_version:
    runs-on: ubuntu-latest
    steps:
      # Do not check out or execute code from the PR in this privileged
      # pull_request_target workflow. Read the version marker as untrusted data.
      - name: Check nf-core template version
        id: versions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          def get_json(url, token=None):
              headers = {
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "nf-core-template-version-check",
              }
              if token:
                  headers["Authorization"] = f"Bearer {token}"
                  headers["X-GitHub-Api-Version"] = "2022-11-28"
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
                  return json.load(response)

          repository = os.environ["HEAD_REPOSITORY"]
          revision = os.environ["HEAD_SHA"]
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
              raise ValueError("Invalid pull-request head repository")
          if not re.fullmatch(r"[0-9a-fA-F]{40}", revision):
              raise ValueError("Invalid pull-request head revision")

          contents_url = (
              f"https://api.github.com/repos/{repository}/contents/.nf-core.yml"
              f"?ref={urllib.parse.quote(revision, safe='')}"
          )
          contents = get_json(contents_url, os.environ["GH_TOKEN"])
          encoded_config = "".join(contents["content"].split())
          config = base64.b64decode(encoded_config, validate=True).decode("utf-8")
          match = re.search(
              r"(?m)^nf_core_version:\s*['\"]?([0-9]+\.[0-9]+\.[0-9]+)['\"]?\s*(?:#.*)?$",
              config,
          )
          if not match:
              raise ValueError(".nf-core.yml has no valid nf_core_version")

          current = match.group(1)
          latest = get_json("https://pypi.org/pypi/nf-core/json")["info"]["version"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", latest):
              raise ValueError("PyPI returned an invalid nf-core version")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"current={current}\n")
              output.write(f"latest={latest}\n")
              output.write(f"outdated={str(tuple(map(int, current.split('.'))) < tuple(map(int, latest.split('.')))).lower()}\n")
          PY

      - name: Post nf-core template version comment
        uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc # v2
        if: steps.versions.outputs.outdated == 'true'
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          allow-repeats: false
          message: |
            > [!WARNING]
            > Newer version of the nf-core template is available.
            >
            > Your pipeline is using an old version of the nf-core template: ${{ steps.versions.outputs.current }}.
            > The latest available nf-core version is ${{ steps.versions.outputs.latest }}.
            >
            > For more documentation on how to update your pipeline, please see the [nf-core documentation](https://github.com/nf-core/tools?tab=readme-ov-file#sync-a-pipeline-with-the-template) and [Synchronisation documentation](https://nf-co.re/docs/contributing/sync).
          #
