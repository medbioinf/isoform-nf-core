repository_type: pipeline

nf_core_version: 3.5.2

lint:
  files_unchanged:
    - .gitignore
    - CODE_OF_CONDUCT.md
    - assets/nf-core-isoform_logo_light.png
    - assets/nf-core-isoform-nf-core_logo_light.png
    - docs/images/nf-core-isoform_logo_light.png
    - docs/images/nf-core-isoform_logo_dark.png
    - docs/images/nf-core-isoform-nf-core_logo_light.png
    - docs/images/nf-core-isoform-nf-core_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/workflows/branch.yml
    - .github/workflows/linting.yml
    - .github/workflows/linting_comment.yml
    - assets/email_template.txt
    - assets/sendmail_template.txt
    - docs/README.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  # Static MultiQC plot export is deliberately disabled because the bundled
  # image does not ship a supported renderer. The interactive HTML report is
  # still produced and validated end to end.
  multiqc_config: false
  # nf-core/tools 3.5.2 only accepts numeric versions in release mode and
  # rejects valid SemVer prerelease identifiers such as 1.0.0-beta.2.
  # Version equality is validated explicitly by the release preparation.
  version_consistency: false
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-isoform_logo_light.png
    - assets/nf-core-isoform-nf-core_logo_light.png
    - docs/images/nf-core-isoform_logo_light.png
    - docs/images/nf-core-isoform_logo_dark.png
    - docs/images/nf-core-isoform-nf-core_logo_light.png
    - docs/images/nf-core-isoform-nf-core_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml

template:
  org: Anton-Bch
  name: isoform-nf-core
  description: General-purpose Nextflow pipeline for isoform switch analysis
  author: Anton Buch and Tobias Polley
  version: 1.0.0-beta.1
  force: true
  outdir: /home/anton/uni/isoform-nf-core
  is_nfcore: false
