repository_type: pipeline

nf_core_version: 3.5.2

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-isoform_logo_light.png
    - docs/images/nf-core-isoform_logo_light.png
    - docs/images/nf-core-isoform_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-isoform_logo_light.png
    - docs/images/nf-core-isoform_logo_light.png
    - docs/images/nf-core-isoform_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml

template:
  org: Anton-Bch
  name: isoform-nf-core
  description: General-purpose Nextflow pipeline for isoform switch analysis
  author: Anton Buch and Tobias Polley
  version: 1.0dev
  force: true
  outdir: /home/anton/uni/isoform-nf-core
  is_nfcore: false
